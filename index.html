<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WriteMate - AI Handwritten Answers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Shadows+Into+Light&family=Indie+Flower&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="logo">
      ✍️ WriteMate
    </div>

    <button id="savedBtn" class="saved-btn">
      📚 Saved Questions
    </button>
  </header>


  <main class="container">

    <section class="hero">
      <h1>Turn Questions Into Beautiful Handwritten Answers</h1>

      <p>
        Enter a question, choose marks, pages and handwriting style.
        WriteMate creates a neat exam-style answer.
      </p>
    </section>


    <section class="card">

      <label class="label">
        📝 Enter Your Question
      </label>

      <textarea
        id="question"
        placeholder="Example: Explain the casting process..."
      ></textarea>


      <div class="grid">

        <div>
          <label class="label">📚 Subject</label>

          <select id="subject">
            <option value="General">General</option>
            <option value="Engineering">Engineering</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="English">English</option>
            <option value="Other">Other</option>
          </select>
        </div>


        <div>
          <label class="label">🎯 Marks</label>

          <select id="marks">
            <option value="2">2 Marks</option>
            <option value="5" selected>5 Marks</option>
            <option value="10">10 Marks</option>
            <option value="15">15 Marks</option>
          </select>
        </div>


        <div>
          <label class="label">📄 Number of Pages</label>

          <select id="pages">
            <option value="1">1 Page</option>
            <option value="2">2 Pages</option>
            <option value="3">3 Pages</option>
            <option value="4">4 Pages</option>
            <option value="5">5 Pages</option>
          </select>
        </div>


        <div>
          <label class="label">🖊️ Ink</label>

          <select id="ink">
            <option value="blue">Blue</option>
            <option value="black">Black</option>
          </select>
        </div>

      </div>


      <label class="label">
        ✒️ Choose Handwriting Style
      </label>

      <div class="styles">

        <button class="style-option active" data-font="Caveat">
          <span style="font-family:Caveat">My Handwriting</span>
        </button>

        <button class="style-option" data-font="Kalam">
          <span style="font-family:Kalam">Neat Handwriting</span>
        </button>

        <button class="style-option" data-font="Patrick Hand">
          <span style="font-family:'Patrick Hand'">Simple Handwriting</span>
        </button>

        <button class="style-option" data-font="Shadows Into Light">
          <span style="font-family:'Shadows Into Light'">Casual Handwriting</span>
        </button>

        <button class="style-option" data-font="Indie Flower">
          <span style="font-family:'Indie Flower'">Student Handwriting</span>
        </button>

      </div>


      <button id="generateBtn" class="generate-btn">
        ✨ Generate Handwritten Answer
      </button>

      <p id="status" class="status"></p>

    </section>


    <section id="resultSection" class="result-section hidden">

      <div class="result-header">
        <h2>📖 Your Handwritten Answer</h2>

        <button id="saveBtn" class="save-btn">
          💾 Save Question
        </button>
      </div>

      <div id="pagesContainer"></div>

    </section>


    <section id="savedSection" class="saved-section hidden">

      <div class="result-header">
        <h2>📚 Saved Questions</h2>

        <button id="closeSavedBtn" class="close-btn">
          ✕ Close
        </button>
      </div>

      <div id="savedList"></div>

    </section>

  </main>


  <footer>
    <p>WriteMate ✍️ — Learn • Write • Remember</p>
  </footer>


  <script src="script.js"></script>

</body>
</html>
